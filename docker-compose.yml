# Produktionsnahe Variante mit echtem PostgreSQL. Nicht in CI getestet.
services:
  app:
    build: .
    ports: ["3000:3000"]
    environment:
      DATABASE_URL: postgres://viral:viral@db:5432/viral
      DATA_DIR: /data
    env_file: [.env]
    volumes: ["media:/data"]
    depends_on: [db]
  db:
    image: postgres:16
    environment: { POSTGRES_USER: viral, POSTGRES_PASSWORD: viral, POSTGRES_DB: viral }
    volumes: ["pg:/var/lib/postgresql/data"]
volumes: { media: {}, pg: {} }
